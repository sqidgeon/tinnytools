<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | TinnyTools</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #1f1f1f;
      color: #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrapper {
      text-align: center;
      max-width: 400px;
    }
    h1 {
      font-size: 8rem;
      font-weight: 700;
      color: #e0e0e0;
    }
    p {
      font-size: 1.2rem;
      margin: 1rem 0;
      color: #aaa;
    }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background: #333;
      color: #ccc;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    a:hover {
      transform: scale(1.05);
      background: #555;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>404</h1>
    <p>Whatever you just did, we did not plan for, we are only human!</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
